name: security-lab1-tests
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: secure_notes_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?Set TEST_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d secure_notes_test"]
      interval: 2s
      timeout: 3s
      retries: 30
