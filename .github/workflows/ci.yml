name: Security CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests-and-sast:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: secure_notes_test
          POSTGRES_USER: test_user
          # Ephemeral runner-only database; never a production credential.
          POSTGRES_PASSWORD: ci-ephemeral-test-password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test_user -d secure_notes_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DB_URL: jdbc:postgresql://localhost:5432/secure_notes_test
      TEST_DB_USER: test_user
      TEST_DB_PASSWORD: ci-ephemeral-test-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Integration tests and SpotBugs + Find Security Bugs
        run: mvn -B -ntp verify
      - name: Publish tests and SAST reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: tests-and-sast
          path: |
            target/surefire-reports/
            target/spotbugsXml.xml
          if-no-files-found: error
      - name: Job summary
        if: success()
        run: |
          echo '### Tests and SAST passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'PostgreSQL integration tests passed. SpotBugs + Find Security Bugs: no unsuppressed SECURITY findings at Low threshold. Reviewed exceptions: docs/security-review.md. XML and test results are attached as artifacts.' >> "$GITHUB_STEP_SUMMARY"
  sca:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/cache@v6
        with:
          path: ~/.m2/dependency-check-data
          key: dependency-check-13-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dependency-check-13-${{ runner.os }}-
      - name: OWASP Dependency-Check (fail on CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp -Psca -DskipTests dependency-check:check
      - name: Publish SCA reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check
          path: target/dependency-check-report.*
          if-no-files-found: error
      - name: Job summary
        if: success()
        run: |
          echo '### SCA passed' >> "$GITHUB_STEP_SUMMARY"
          echo 'OWASP Dependency-Check completed. No dependency vulnerabilities with CVSS >= 7. HTML and JSON reports are attached as artifacts.' >> "$GITHUB_STEP_SUMMARY"
